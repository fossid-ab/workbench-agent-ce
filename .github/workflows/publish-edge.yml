# Publishes ghcr.io/fossid-ab/workbench-agent-ce:edge from the checked-out ref.
# Run via workflow_dispatch from the main branch so :edge matches main and
# dogfood workflows (dogfood-*.yml) pull the expected image.
name: Publish Edge Image to GHCR

on: workflow_dispatch

concurrency:
  group: ghcr-edge
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fossid-ab/workbench-agent-ce:edge
          labels: |
            org.opencontainers.image.title=workbench-agent-ce
            org.opencontainers.image.revision=${{ github.sha }}
