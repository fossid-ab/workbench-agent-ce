# .github/workflows/tests.yml
name: Run Tests

# Run when non-API application code or tests change.
on:
  push:
    paths-ignore:
      - 'src/workbench_agent/api/**'
      - 'tests/api/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'src/workbench_agent/api/**'
      - 'tests/api/**'
      - '.github/workflows/**'

# For functional tests, set these repository secrets:
# - WORKBENCH_URL: Your Workbench server URL (e.g., https://workbench.example.com/api.php)
# - WORKBENCH_USER: Your Workbench username
# - WORKBENCH_TOKEN: Your Workbench API token
# Functional tests will be skipped if secrets are not configured.

jobs:
  unit_tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-xdist pytest-mock
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit_tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-xdist pytest-mock
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

  functional_tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: [integration_tests]
    # Functional tests will be skipped by pytest if secrets are not configured
    # This is fine for forks or repos without Workbench access
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run functional tests
        env:
          WORKBENCH_URL: ${{ secrets.WORKBENCH_URL }}
          WORKBENCH_USER: ${{ secrets.WORKBENCH_USER }}
          WORKBENCH_TOKEN: ${{ secrets.WORKBENCH_TOKEN }}
        run: |
          pytest tests/functional/ -v -m functional -n 4 --tb=short --junit-xml=functional-test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: functional-test-results
          path: functional-test-results.xml
          if-no-files-found: ignore
